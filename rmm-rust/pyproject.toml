[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "rmm-rust"
version = "0.1.0"
description = "High-performance Resonant Memory Mesh kernel with Python bindings"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "maturin>=1.4.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
